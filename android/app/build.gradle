apply plugin: 'com.android.application'

// CI-overridable release signing: unset locally (no keystore is ever
// committed to this repo), populated only by -P flags the android-apk.yml
// workflow passes from GitHub secrets. A local/manual build with none of
// these set behaves exactly as before this change — release stays unsigned.
def releaseStoreFile = project.findProperty('RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('RELEASE_KEY_PASSWORD')

// Computed as plain locals, not inline in the DSL block below: Groovy's
// parenthesis-less command-call syntax (`versionName expr ?: fallback`)
// does NOT bind the elvis operator into the call's argument the way it
// reads — it parses as `versionName(expr) ?: fallback`, silently calling
// the DSL setter with a null/wrong value. Resolving to a simple local
// first and passing that bare variable into the DSL sidesteps the
// ambiguity entirely (same shape as the original hardcoded `versionCode 1`).
def ciVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def ciVersionName = (project.findProperty('appVersionName') ?: '1.0').toString()

android {
    namespace = "ai.quickapp.fieldforce"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.quickapp.fieldforce"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI-overridable so a release build's version can be set above
        // whatever is already live (required for Android to accept it as
        // an update) — see android-apk.yml. Falls back to the previous
        // hardcoded values when not passed.
        versionCode ciVersionCode
        versionName ciVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
